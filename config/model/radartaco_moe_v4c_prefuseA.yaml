# RadarTaco MoE v4c + two-stage pre-fusion, Option A.
#
# One extra `_FusionBlock` (full-cap, ~2M params at L=2) runs BEFORE the
# router. Both the router AND the halved experts operate on the pre-fused,
# radar-informed feature. Output is:
#     feat_prefused + Σ_k gate[k] · (expert_k(feat_prefused) - feat_prefused)
#
# Rationale:
#   • Router sees radar-informed features → routing can leverage direct
#     depth cues (radar returns), not just monocular cues from image.
#   • Experts specialize on TOP of a shared radar-fused base; less pressure
#     to relearn generic radar integration inside each expert.
#
# Cost vs plain v4c: one extra full-cap fusion pass per node/edge block
# (~+30-40% forward time), +~4M params (two blocks: node + edge).
name: radartaco
radar_encoder: gnn
k_neighbors: 8
mlp_hidden: 128
a_l: [48.0, 32.0, 16.0]
radar_channels: [64, 128, 512]
attn_heads: 4
pretrained_image_encoder: true
output_mode: metric
min_depth_clip: 0.5
multi_scale: false
multi_scale_levels: [2, 4, 8, 16]

# ── MoE options ──
moe_at_l: [2]
moe_n_experts: 3
moe_use_shared: false
moe_top_k: 2
moe_stage: 2
moe_bins: [0.0, 20.0, 50.0, 100.0]
moe_router_arch: mlp3x3
moe_expert_ch_ratio: 0.5
moe_router_gt_type: soft

# ── Pre-fusion (Option A) ──
moe_pre_fusion_enabled: true
moe_pre_fusion_feed_experts: true       # A: experts see pre-fused feat
moe_pre_fusion_ch_ratio: 1.0            # full cap (matches _FusionBlock)
moe_pre_fusion_router_detach: false     # router grad reaches pre-fusion
