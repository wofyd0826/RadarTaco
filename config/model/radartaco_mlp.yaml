# MLP radar encoder ablation
name: radartaco
radar_encoder: mlp
k_neighbors: 20              # ignored for MLP
mlp_hidden: 128
a_l: [48.0, 32.0, 16.0]
radar_channels: [64, 128, 512]
attn_heads: 4
pretrained_image_encoder: true
output_mode: metric
min_depth_clip: 0.5
multi_scale: false
multi_scale_levels: [2, 4, 8, 16]
