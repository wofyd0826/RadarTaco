# RadarTaco MoE v4c — balanced bin edges [0, 10, 25, 100].
#
# Same architecture as radartaco_moe_v4c (top_k=2, halved experts, SOFT
# router GT, mlp3x3 router). Only difference: `moe_bins` is retuned from
# [0, 20, 50, 100] → [0, 10, 25, 100].
#
# Motivation (from balanced_bins.txt pixel-share analysis):
#   Bins        | near %   | mid %    | far %
#   [0,20,50]   |  58.8%   |  29.3%   |  11.9%   ← current v4c (near-heavy)
#   [0,10,25]   |  ~35%    |  ~34%    |  ~31%    ← this variant (~balanced)
#
#   • Each expert now sees roughly the same pixel count during teacher
#     forcing → equalized training signal per expert.
#   • Near expert covers a MUCH narrower range (0-10m) — far more specialized
#     on true close-range objects (vehicles-in-cut, close pedestrians).
#   • Far expert absorbs 25-100m — the large low-density tail is unified so
#     the far expert sees enough training data.
#   • Boundary tokens shift: near-mid boundary from ~18-22m to ~8-12m; mid-far
#     boundary from ~45-55m to ~22-28m. May reduce boundary uncertainty since
#     new boundaries are at less-ambiguous depths.
#
# Rounded from equal-thirds percentiles (p33=9.3m, p67=24.8m) for
# operational neatness. Actual balance ≈ 35/34/31%, close enough.
name: radartaco
radar_encoder: gnn
k_neighbors: 8
mlp_hidden: 128
a_l: [48.0, 32.0, 16.0]
radar_channels: [64, 128, 512]
attn_heads: 4
pretrained_image_encoder: true
output_mode: metric
min_depth_clip: 0.5
multi_scale: false
multi_scale_levels: [2, 4, 8, 16]

# ── MoE options ──
moe_at_l: [2]
moe_n_experts: 3
moe_use_shared: false
moe_top_k: 2
moe_stage: 2
moe_bins: [0.0, 10.0, 25.0, 100.0]    # ← rebalanced (was [0, 20, 50, 100])
moe_router_arch: mlp3x3
moe_expert_ch_ratio: 0.5
moe_router_gt_type: soft
