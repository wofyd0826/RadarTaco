# GNN radar encoder (paper-faithful) — DEFAULT
name: radartaco
radar_encoder: gnn          # 'gnn' or 'mlp'
# DGCNN-style kNN size. nuScenes gives ~97 radar points/frame, so k=20 covered
# 21.8% of the cloud and the 20th neighbour sat 17 m away — a sparse *global*
# graph, not the local one EdgeConv assumes. k=8 pulls the neighbourhood back
# inside a few metres.
k_neighbors: 8
mlp_hidden: 128              # only used when radar_encoder='mlp'
a_l: [48.0, 32.0, 16.0]      # paper §4.2 + supp Table 9 — radar-centered window widths
radar_channels: [64, 128, 512]
attn_heads: 4
pretrained_image_encoder: true
# Depth output parametrization (paper §3 + Supp §8.2 = 'metric' default).
#   metric  : d  = max_depth × sigmoid(head)             (paper-faithful)
#   inverse : 1/d = inv_min + sigmoid(head) × (inv_max - inv_min); model
#             returns metric d via reciprocal so downstream losses stay in
#             metric space. Better long-range gradients (no sigmoid
#             saturation at far distances).
output_mode: metric
min_depth_clip: 0.5             # only used by output_mode=inverse
# Deep supervision via auxiliary heads at coarser decoder scales. When
# enabled the decoder returns a dict during training; eval/inference still
# returns just the final-scale tensor (no caller-side change). Pair this
# with loss.w_multi_scale > 0 to actually use the aux outputs in training.
multi_scale: false
multi_scale_levels: [2, 4, 8, 16]    # 1/2, 1/4, 1/8, 1/16 strides
