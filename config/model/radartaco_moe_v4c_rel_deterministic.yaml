# RadarTaco MoE v4c-based, ROUTER REMOVED — routing is deterministic from rel_depth.
#
# Difference from v4c: `moe_router_arch: mlp3x3` → `deterministic_rel_depth`.
# Effect:
#   • Router network completely deleted (no learned params, no forward).
#   • Gate computed at forward time by binning `rel_depth` (Marigold, [0, 1])
#     against `moe_bins`, then pooling one-hot to token grid → per-token
#     pixel_fraction. This IS the gate (soft), top_k=2 trims + renormalizes.
#   • Router CE loss should be 0 (nothing to train).
#   • Router GT / teacher-forcing IS UNUSED — routing is 100% deterministic
#     at both train and inference, no stage-1 vs stage-2 distinction.
#
# Bins on rel_depth ∈ [0, 1] chosen at ≈ p33 / p66 (quantile from 100 sample
# images: p33=0.174, p66=0.382) so each bin owns ~1/3 of pixels. Rel_depth
# is heavy-tailed toward 0 (most pixels are far-scene in driving) — uniform
# [0, 0.33, 0.66] would leave ~80% of pixels in bin 0.
#
# Specialists still trained on GT depth (task loss unchanged). Only the
# routing supervision changes.
name: radartaco
radar_encoder: gnn
k_neighbors: 8
mlp_hidden: 128
a_l: [48.0, 32.0, 16.0]
radar_channels: [64, 128, 512]
attn_heads: 4
pretrained_image_encoder: true
output_mode: metric
min_depth_clip: 0.5
multi_scale: false
multi_scale_levels: [2, 4, 8, 16]

# ── MoE options ──
moe_at_l: [2]
moe_n_experts: 3
moe_use_shared: false
moe_top_k: 2
moe_stage: 2                              # Nominal; no teacher-forcing anyway.
# Bins on REL_DEPTH scale (not metric). Quantile-based (p33 / p66).
moe_bins: [0.0, 0.174, 0.382, 1.001]
moe_router_arch: deterministic_rel_depth  # ← NEW: no learned router
moe_expert_ch_ratio: 0.5
moe_router_gt_type: soft                  # Nominal; unused by deterministic router.
