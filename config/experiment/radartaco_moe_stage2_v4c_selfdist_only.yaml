# @package _global_
# MoE v4c stage-2 with router SELF-DISTILLATION ONLY (ablation, high risk).
#
# GT CE is REMOVED (w_router=0). Router is trained purely by the pixel_fraction
# of the model's OWN final depth (bucketized to `moe_bins`), detached target.
#
# Purpose:
#   Extreme ablation of the "self-dist balanced" experiment. Tests whether
#   self-dist ALONE (no GT anchor) is enough to produce a useful router, or
#   whether the circular signal causes degenerate collapse.
#
#   Expected outcomes:
#     • Balanced ≈ baseline → self-dist ineffective (GT CE was sufficient)
#     • Only < balanced ≪ baseline → self-dist alone collapses (needs GT)
#     • Only ≈ balanced ≈ baseline → self-dist can stand alone (surprising)
#     • Only ≤ balanced < baseline → self-dist is the DOMINANT useful signal
#
# Risk: without GT anchor, router may learn to output "whatever gate makes
#   current model output happy", which decouples from real bin correctness.
#   Warm-start from v4c stage 1 gives a good starting router — if the
#   collapse happens, it's evidence that this signal is fundamentally
#   insufficient rather than a chicken-and-egg initialization issue.
defaults:
  - override /model: radartaco_moe_v4c
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 2
  moe_use_shared: false
  moe_top_k: 2
  moe_expert_ch_ratio: 0.5
  moe_router_gt_type: soft

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  # ⚠️ GT CE disabled. Router receives NO ground-truth bin supervision.
  w_router: 0.0
  # Only signal: self-dist. Weight matches original v4c router weight so
  # router loss magnitude is comparable to the baseline experiment.
  w_router_selfdist: 5.0

training:
  epochs: 20
  # Warm-start from v4c stage 1 — router is already competent from GT CE, so
  # `depth` is meaningful. This isolates "GT CE removal at stage 2" as the
  # single variable vs baseline v4c stage 2.
  load_weights_from: output/radartaco_moe_stage1_v4c/last.pt
  load_weights_carry_schedule: true

wandb:
  name: radartaco_moe_stage2_v4c_selfdist_only
  tags: [moe, stage2, self-routing, no-shared, router-mlp3x3, top_k2,
         expert-ratio-half, soft-ce, v4c, self-distillation, only]
  notes: >
    Stage-2 MoE v4c, router supervised ONLY by self-dist (w=5.0). GT CE
    disabled (w_router=0). Warm-start from v4c stage 1. 20 epoch. Tests
    whether self-dist alone suffices or collapses without GT anchor.
