# @package _global_
# Specialisation ablation: shape_lidar_grad_shape_edge_res trained ONLY on
# night_clear samples (train=2,863 / val=482).
defaults:
  - override /model: radartaco_gnn
  - override /dataset: nuscenes
  - override /training: default
  - override /loss: default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar
  split_train: /data/public/nuScenes/derived/splits/train_night_clear.txt
  split_val:   /data/public/nuScenes/derived/splits/val_night_clear.txt
  split_test:  /data/public/nuScenes/derived/splits/test_night_clear.txt

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0

wandb:
  name: specialist_night_clear
  tags: [specialization, night-clear, shape-loss, dense-gt-edge-res, grad-shape]
  notes: >
    shape_lidar_grad_shape_edge_res trained on night_clear samples only
    (~2.9k train).
