# @package _global_
# MoE v4a stage-1 (teacher forcing) — Option A: top_k=2 with halved experts.
#
# Trained from scratch (like v3_fix stage 1). At stage 1 the gate is
# teacher-forced to the hard majority-vote bin — the top_k=2 setting only
# matters at stage 2. That said, halved experts affect the entire model
# from step 1, so this must be re-trained (cannot warm-start from v3_fix).
#
# Run order:
#   1. python scripts/train.py +experiment=radartaco_moe_stage1_v4a
#   2. python scripts/train.py +experiment=radartaco_moe_stage2_v4a
defaults:
  - override /model: radartaco_moe_v4a
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 1
  moe_use_shared: false
  moe_top_k: 2                 # kept for consistency; teacher-force overrides gate anyway
  moe_expert_ch_ratio: 0.5
  moe_router_gt_type: hard

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  w_router: 10.0

training:
  epochs: 30

wandb:
  name: radartaco_moe_stage1_v4a
  tags: [moe, stage1, teacher-forcing, no-shared, router-mlp3x3, top_k2, expert-ratio-half, hard-ce, v4a]
  notes: >
    Stage-1 MoE v4a — top_k=2 with halved experts (expert_ch_ratio=0.5)
    to hold ACTIVE params/token ~matched to top_k=1 baseline. Hard CE
    router target (majority-vote bin). 30 epoch teacher-forcing from
    scratch. Sibling: radartaco_moe_stage1_v4c (soft CE).
