# @package _global_
# MoE v6c_confshared stage-1 — DISJOINT training (main=spec only, aux=shared only)
# + confidence gating at inference.
#
# Contrast with v6b: v6b keeps shared in the main head during training (v5
# always-on) and adds an aux loss to reinforce shared standalone. v6c
# removes shared from the main head entirely during training, so main is
# specialists-only. Shared is trained ONLY through the aux head (aux loss
# is REQUIRED — without it shared receives no gradient at all).
#
#   Training path:
#     mixed             = feat + Σ_k spec_gate[k]·(expert_k − feat)   (main)
#     mixed_shared_only = feat + shared_delta                          (aux)
#     → specialists trained by main task loss, shared trained by aux task loss.
#       Gradients are DISJOINT — no cross-head coupling through prediction.
#
#   Inference path:
#     spec_gate ← spec_gate · α,  shared_weight ← 1 − α
#     → α-mix of the two disjointly-trained heads.
#
# Run order:
#   1. python scripts/train.py +experiment=radartaco_moe_stage1_v6c_confshared
#   2. python scripts/train.py +experiment=radartaco_moe_stage2_v6c_confshared
defaults:
  - override /model: radartaco_moe_v6c_confshared
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 1
  moe_use_shared: true
  moe_shared_gate_mode: confidence_infer_disjoint
  moe_shared_aux: true
  moe_top_k: 2
  moe_expert_ch_ratio: 0.5
  moe_router_gt_type: soft

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  w_router: 10.0
  # Auxiliary shared-only task loss weight. In v6c this is the ONLY loss
  # signal for shared (main head excludes shared during training). Bumped
  # to 1.0 (from v6b's 0.3) so the aux gradient is on par with the main
  # task loss — otherwise shared would learn 3× slower than specialists.
  w_shared_aux: 1.0

training:
  epochs: 30

wandb:
  name: radartaco_moe_stage1_v6c_confshared
  tags: [moe, stage1, disjoint-train-infer-conf, router-mlp3x3, top_k2, expert-ratio-half, soft-ce, v6c_confshared]
  notes: >
    Stage-1 MoE v6c_confshared — DISJOINT heads during training. Main
    head = specialists only (shared_weight=0 in mixed during train),
    aux head = shared only. Shared is trained EXCLUSIVELY by aux loss
    (w_shared_aux=1.0). Inference switches to conservation
    confidence gating (spec × α, shared 1 − α). 30 epoch from scratch.
