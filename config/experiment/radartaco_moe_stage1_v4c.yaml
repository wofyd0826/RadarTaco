# @package _global_
# MoE v4c stage-1 (teacher forcing) — Options A + C:
#   top_k=2 + halved experts + SOFT router CE.
#
# Same architecture as v4a. Only difference: `moe_router_gt_type: soft`.
# The router sees pixel-bin FRACTIONS as its CE target instead of the
# argmax bin, and stage-1 teacher-forcing gate is SOFT (= frac directly).
#
# Rationale: hard CE plateaus near 90% because boundary tokens have
# unstable majority-vote labels. Soft CE gives them a well-defined
# probability target that the router can actually match.
#
# Run order:
#   1. python scripts/train.py +experiment=radartaco_moe_stage1_v4c
#   2. python scripts/train.py +experiment=radartaco_moe_stage2_v4c
defaults:
  - override /model: radartaco_moe_v4c
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 1
  moe_use_shared: false
  moe_top_k: 2
  moe_expert_ch_ratio: 0.5
  moe_router_gt_type: soft

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  w_router: 10.0

training:
  epochs: 30

wandb:
  name: radartaco_moe_stage1_v4c
  tags: [moe, stage1, teacher-forcing, no-shared, router-mlp3x3, top_k2, expert-ratio-half, soft-ce, v4c]
  notes: >
    Stage-1 MoE v4c — same arch as v4a but router trained with SOFT CE
    against pixel-bin fractions. Teacher-force gate is soft (=frac),
    matching the `perfect_soft` ceiling regime. 30 epoch from scratch.
