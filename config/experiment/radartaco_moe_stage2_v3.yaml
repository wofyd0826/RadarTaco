# @package _global_
# Stage-2 (self-routing) — v3 pipeline WITH router CE anchor.
#
# v3 changes vs radartaco_moe_stage2_v2.yaml:
#   • model = radartaco_moe_v3 (router = mlp3x3)
#   • w_router = 5.0 (DriveMoE stage-2 λ2; keeps router learning via CE
#     since top_k=1 blocks task-loss gradient to router)
#   • model.forward now emits router_gts in stage-2 too (backward-compat
#     via new teacher_force decoupling in MoEFusionBlock).
#
# 20 epoch continuing from stage-1 v3 best.pt. Total 30+20=50 = baseline.
defaults:
  - override /model: radartaco_moe_v3
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 2
  moe_use_shared: false
  moe_top_k: 1

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  w_router: 5.0                # ← CE anchor; router keeps learning

training:
  epochs: 20
  load_weights_from: output/radartaco_moe_stage1_v3/last.pt

wandb:
  name: radartaco_moe_stage2_v3
  tags: [moe, stage2, self-routing, no-shared, router-mlp3x3, ce-anchor]
  notes: >
    Stage-2 MoE v3 — self-routing with router CE anchor (w_router=5).
    Requires teacher_force-decoupled MoEFusionBlock (radartaco.py + radar_fusion.py).
