# @package _global_
# MoE v4c stage-2 (self-routing) — v4c + Class-Balanced weighted CE.
# Warm-start MUST come from radartaco_moe_stage1_v4c_cb.
defaults:
  - override /model: radartaco_moe_v4c
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 2
  moe_use_shared: false
  moe_top_k: 2
  moe_expert_ch_ratio: 0.5
  moe_router_gt_type: soft

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  w_router: 5.0
  router_class_weight: [0.54, 0.89, 1.56]

training:
  epochs: 20
  load_weights_from: output/radartaco_moe_stage1_v4c_cb/last.pt
  load_weights_carry_schedule: true

wandb:
  name: radartaco_moe_stage2_v4c_cb
  tags: [moe, stage2, self-routing, no-shared, router-mlp3x3, top_k2, expert-ratio-half, soft-ce, class-balanced, v4c_cb]
  notes: >
    Stage-2 v4c_cb — self-routing at top_k=2 with class-balanced
    weighted CE. Warm-start from stage1_v4c_cb last.pt.
