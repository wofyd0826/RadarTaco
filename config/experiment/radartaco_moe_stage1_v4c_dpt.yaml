# @package _global_
# MoE v4c stage-1 (teacher forcing) — DPT-style multi-scale router.
# Identical to stage1_v4c EXCEPT router_arch: mlp3x3 → dpt, and router
# consumes image_encoder F3..F6 rather than the fusion block's `feat`.
defaults:
  - override /model: radartaco_moe_v4c_dpt
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 1
  moe_use_shared: false
  moe_top_k: 2
  moe_expert_ch_ratio: 0.5
  moe_router_gt_type: soft

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  w_router: 10.0

training:
  epochs: 30

wandb:
  name: radartaco_moe_stage1_v4c_dpt
  tags: [moe, stage1, teacher-forcing, no-shared, router-dpt, top_k2, expert-ratio-half, soft-ce, v4c_dpt]
  notes: >
    Stage-1 v4c with DPT-style multi-scale router (F3..F6, fusion_ch=128).
    Analogue of DepthBin.head_dpt but reassembly target = MoE token grid
    instead of 4x it. Aims to break the 90% router acc ceiling by giving
    routing access to features at multiple encoder scales.
