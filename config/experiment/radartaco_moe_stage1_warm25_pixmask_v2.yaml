# @package _global_
# Stage-1 (teacher-forcing) + per-pixel bin mask — warm25 pipeline (v2).
#
# v2 vs original radartaco_moe_stage1_warm25_pixmask.yaml:
#   • Identical config, but requires the FIXED loss factory where pixmask
#     also applies to grad_shape (not only L1_lidar). The bug that limited
#     pixmask to L1_lidar was fixed in src/loss/factory.py after the
#     original pixmask run had already started; this v2 name isolates the
#     new (correct) behaviour into a separate output dir.
#
# Loss applied to pixels whose true bin == token's routed bin:
#   • L1_lidar        (sparse LiDAR term, already masked in v1)
#   • grad_shape ×100 (multi-scale log-grad term, NEWLY masked in v2)
#   • router CE ×10   (untouched by pixmask, applies to all tokens)
defaults:
  - override /model: radartaco_moe
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 1
  moe_use_shared: false
  moe_top_k: 1

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  w_router: 10.0
  moe_pixel_bin_mask: true
  moe_pixel_bin_mask_bins: [0.0, 20.0, 50.0, 100.0]

training:
  epochs: 15
  load_weights_from: output/radartaco_moe_warm_from_baseline25/init.pt

wandb:
  name: radartaco_moe_stage1_warm25_pixmask_v2
  tags: [moe, stage1, teacher-forcing, warm-start-baseline25, no-shared, pixel-mask, v2-grad-shape-masked]
  notes: >
    v2: pixmask applies to both L1_lidar and grad_shape (v1 had bug
    where grad_shape was not masked). Otherwise identical to v1.
