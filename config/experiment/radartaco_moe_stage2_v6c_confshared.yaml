# @package _global_
# MoE v6c_confshared stage-2 — DISJOINT training + confidence gating at inference.
#
# See radartaco_moe_stage1_v6c_confshared for full design description.
#
# Warm-start MUST come from radartaco_moe_stage1_v6c_confshared.
defaults:
  - override /model: radartaco_moe_v6c_confshared
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 2
  moe_use_shared: true
  moe_shared_gate_mode: confidence_infer_disjoint
  moe_shared_aux: true
  moe_top_k: 2
  moe_expert_ch_ratio: 0.5
  moe_router_gt_type: soft

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  w_router: 5.0
  # Same as stage 1 — shared depends entirely on this signal.
  w_shared_aux: 1.0

training:
  epochs: 20
  load_weights_from: output/radartaco_moe_stage1_v6c_confshared/last.pt
  load_weights_carry_schedule: true

wandb:
  name: radartaco_moe_stage2_v6c_confshared
  tags: [moe, stage2, disjoint-train-infer-conf, router-mlp3x3, top_k2, expert-ratio-half, soft-ce, v6c_confshared]
  notes: >
    Stage-2 MoE v6c_confshared — self-routing. Training keeps DISJOINT
    heads (main=spec only, aux=shared only). Inference uses conservation
    confidence gating. 20 epoch warm-start from
    radartaco_moe_stage1_v6c_confshared.
