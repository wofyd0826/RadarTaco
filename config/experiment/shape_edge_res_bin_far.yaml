# @package _global_
# Depth-specialist experiment — FAR bin.
#
# Base: shape_lidar_grad_shape_edge_res. Loss restricted to GT ∈ [50, 100) m.
# See shape_edge_res_bin_near.yaml for design notes.
defaults:
  - override /model: radartaco_gnn
  - override /dataset: nuscenes
  - override /training: default
  - override /loss: default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  # Depth-bin restriction ── FAR
  depth_bin_min: 50.0
  depth_bin_max: 100.0

wandb:
  name: shape_edge_res_bin_far
  tags: [depth-specialist, bin-far, grad-shape, edge-res]
  notes: >
    Depth-specialist ablation — loss restricted to GT ∈ [50, 100) m.
    All other settings identical to shape_lidar_grad_shape_edge_res.
