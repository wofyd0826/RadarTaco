# @package _global_
# MoE v4c stage-1 — DPT-style router with ALL 6 image encoder layers (F1..F6).
defaults:
  - override /model: radartaco_moe_v4c_dpt_full
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 1
  moe_use_shared: false
  moe_top_k: 2
  moe_expert_ch_ratio: 0.5
  moe_router_gt_type: soft

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  w_router: 10.0

training:
  epochs: 30

wandb:
  name: radartaco_moe_stage1_v4c_dpt_full
  tags: [moe, stage1, teacher-forcing, no-shared, router-dpt, top_k2, expert-ratio-half, soft-ce, dpt-full-6layers, v4c_dpt_full]
  notes: >
    Stage-1 v4c with DPT-style router consuming ALL 6 image encoder
    layers (F1..F6). Fuller multi-scale coverage than the 4-layer
    default; measurably slower per step due to F1 projection cost.
