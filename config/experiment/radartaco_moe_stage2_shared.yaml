# @package _global_
# Stage-2 (self-routing) — SHARED-expert variant.
#
# Same as `radartaco_moe_stage2.yaml` but keeps a shared expert.
# In stage 2 with top_k=1, each token's fused output is
#     fused = expert_top1(feat) + delta_shared
# where top1 is the router's argmax.
#
# Warm-start from the shared stage-1 checkpoint via
# `training.load_weights_from=output/radartaco_moe_stage1_shared/.../best.pt`.
defaults:
  - override /model: radartaco_moe
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 2
  moe_use_shared: true    # ← key difference

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  w_router: 0.0

training:
  epochs: 20

wandb:
  name: radartaco_moe_stage2_shared
  tags: [moe, stage2, self-routing, depth-specialist, shared-expert]
  notes: >
    Stage 2 top-1 self-routing WITH shared expert. Warm-started from
    stage-1 shared checkpoint.
