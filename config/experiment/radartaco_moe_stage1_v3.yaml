# @package _global_
# Stage-1 (teacher-forcing) — v3 pipeline.
#
# v3 changes vs radartaco_moe_stage1_v2.yaml:
#   • model = radartaco_moe_v3 (router = mlp3x3, ~1.47M params/router)
#
# 30 epoch, from scratch, gate = one_hot(GT), w_router=10.
defaults:
  - override /model: radartaco_moe_v3
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 1
  moe_use_shared: false
  moe_top_k: 1

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  w_router: 10.0

training:
  epochs: 30

wandb:
  name: radartaco_moe_stage1_v3
  tags: [moe, stage1, teacher-forcing, no-shared, router-mlp3x3]
  notes: >
    Stage-1 MoE v3 — router architecture upgraded to mlp3x3.
    30 epoch teacher-forcing. Fresh scratch training.
