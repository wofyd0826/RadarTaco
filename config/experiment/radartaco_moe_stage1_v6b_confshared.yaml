# @package _global_
# MoE v6b_confshared stage-1 — train v5-style (always-on), infer conservation.
#
# Sole difference from v6a: moe_shared_gate_mode: confidence → confidence_infer.
#
#   Training path: spec_gate ← spec_gate, shared_weight ← 1
#     ⇒ shared receives full gradient on every token — learns generalist.
#   Inference path (for eval / downstream use):
#     spec_gate ← spec_gate · α, shared_weight ← 1 − α
#     ⇒ shared dominates when router uncertain.
#
# Run order:
#   1. python scripts/train.py +experiment=radartaco_moe_stage1_v6b_confshared
#   2. python scripts/train.py +experiment=radartaco_moe_stage2_v6b_confshared
defaults:
  - override /model: radartaco_moe_v6b_confshared
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 1
  moe_use_shared: true
  moe_shared_gate_mode: confidence_infer
  moe_shared_aux: true
  moe_top_k: 2
  moe_expert_ch_ratio: 0.5
  moe_router_gt_type: soft

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  w_router: 10.0
  # Auxiliary shared-only task loss weight. Aux = w_lidar·L1(depth_shared,lidar)
  # + w_grad_shape·grad_shape(depth_shared,dense); the sum is scaled by
  # w_shared_aux and added to loss_total. Start at 0.3 (moderate) — high
  # enough to actually train shared standalone, low enough not to dominate
  # the main mixed-path loss.
  w_shared_aux: 0.3

training:
  epochs: 30

wandb:
  name: radartaco_moe_stage1_v6b_confshared
  tags: [moe, stage1, shared-train-full-infer-conf, router-mlp3x3, top_k2, expert-ratio-half, soft-ce, v6b_confshared]
  notes: >
    Stage-1 MoE v6b_confshared — training uses always-on shared so it
    receives full gradient on every token (generalist path). Inference
    switches to conservation confidence gating (spec × α, shared 1 − α).
    30 epoch from scratch.
