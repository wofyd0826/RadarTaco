# @package _global_
# MoE v5_shared stage-1 (teacher forcing) — v4c + shared expert.
#
# Same recipe as radartaco_moe_stage1_v4c EXCEPT moe_use_shared: true.
# The shared expert is applied unconditionally on top of the specialist
# mixture (see model config for details).
#
# Run order:
#   1. python scripts/train.py +experiment=radartaco_moe_stage1_v5_shared
#   2. python scripts/train.py +experiment=radartaco_moe_stage2_v5_shared
defaults:
  - override /model: radartaco_moe_v5_shared
  - override /dataset: nuscenes
  - override /training: default
  - override /loss:  default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

model:
  moe_stage: 1
  moe_use_shared: true
  moe_top_k: 2
  moe_expert_ch_ratio: 0.5
  moe_router_gt_type: soft

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  w_router: 10.0

training:
  epochs: 30

wandb:
  name: radartaco_moe_stage1_v5_shared
  tags: [moe, stage1, teacher-forcing, shared-on, router-mlp3x3, top_k2, expert-ratio-half, soft-ce, v5_shared]
  notes: >
    Stage-1 MoE v5_shared — v4c architecture + shared expert enabled.
    Shared applies unconditionally on top of specialist mixture, acting
    as a baseline-like safety net that softens misroute cost. Router
    behavior (K-way soft CE) unchanged from v4c. 30 epoch from scratch.
