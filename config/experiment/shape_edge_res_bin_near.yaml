# @package _global_
# Depth-specialist experiment — NEAR bin.
#
# Base: shape_lidar_grad_shape_edge_res (same model, dataset, loss weights).
# Only the loss is restricted to pixels with GT depth in [0, 20) m — both
# the sparse-LiDAR L1 anchor and the multi-scale log-grad shape term.
# Non-bin pixels contribute zero gradient. Pixel-count imbalance across
# specialists is intentionally left uncompensated.
#
# See config/experiment/shape_lidar_grad_shape_edge_res.yaml for the base
# loss formula and dataset choice.
defaults:
  - override /model: radartaco_gnn
  - override /dataset: nuscenes
  - override /training: default
  - override /loss: default

dataset:
  dense_gt_dir: depth_edge_res
  lidar_gt_dir: depth_lidar
  val_lidar_gt_dir: depth_lidar

loss:
  w_lidar: 1.0
  lam: 0.0
  w_grad_shape: 100.0
  grad_shape_scales: 4
  grad_shape_use_log: true
  w_shape_global: 0.0
  w_shape_grid: 0.0
  w_anchored_global: 0.0
  w_anchored_grid: 0.0
  w_affine_anchor: 0.0
  lidar_consistency_threshold: 0.0
  w_anti_stripe: 0.0
  # Depth-bin restriction ── NEAR
  depth_bin_min: 0.0
  depth_bin_max: 20.0

wandb:
  name: shape_edge_res_bin_near
  tags: [depth-specialist, bin-near, grad-shape, edge-res]
  notes: >
    Depth-specialist ablation — loss restricted to GT ∈ [0, 20) m.
    All other settings identical to shape_lidar_grad_shape_edge_res.
