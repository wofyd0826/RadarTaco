# Hydra root config. Override via experiment configs:
#   python scripts/train.py +experiment=baseline_gnn

defaults:
  - model: radartaco_gnn
  - dataset: nuscenes
  - training: default
  - loss: default
  - _self_

wandb:
  enabled: true
  project: radartaco
  entity: null
  name: null
  group: null
  tags: []
  notes: null

hydra:
  # Hydra's per-run scratch (cfg snapshot, .hydra/, logs) is segregated
  # under output/_hydra/ so the experiment dirs stay clean.
  run:
    dir: output/_hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: output/_hydra/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
