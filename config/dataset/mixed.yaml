# Multi-loader: mix nuScenes (real) with Hypersim + vKITTI2 (sim).
# Used by experiments/mixed_with_aux.yaml.
name: mixed
data_root: /data/public/nuScenes/derived
split_train:     /data/public/nuScenes/derived/splits/train.txt
split_val:       /data/public/nuScenes/derived/splits/val.txt
split_test:      /data/public/nuScenes/derived/splits/test.txt
split_train_day:   /data/public/nuScenes/derived/splits/train_day.txt
split_train_night: /data/public/nuScenes/derived/splits/train_night.txt
split_val_day:     /data/public/nuScenes/derived/splits/val_day.txt
split_val_night:   /data/public/nuScenes/derived/splits/val_night.txt
split_test_day:    /data/public/nuScenes/derived/splits/test_day.txt
split_test_night:  /data/public/nuScenes/derived/splits/test_night.txt
night_ids_file:    /data/public/nuScenes/derived/splits/night_ids.txt

photometric_aug:
  enabled: false
  prob: 0.5
  gamma_range:      [1.5, 3.0]
  brightness_range: [0.3, 0.7]
  contrast_range:   [0.5, 0.9]
  noise_std_range:  [0.0, 0.05]
  apply_to_night:   false
dense_gt_dir: depth_acc
radar_3d_dir:  radar_3d
max_radar_points: 128
max_depth: 100.0
min_depth: 1.0e-3
train_resize_hw: null
train_crop_hw: null
num_workers: 4
batch_size: 12

sim:
  enabled: true
  ratio_real: 0.7              # weight for nuScenes
  ratio_sim: 0.3               # total weight for the union of sim datasets
  radar_simulation: augmented
  num_radar_points_min: 30
  num_radar_points_max: 60
  depth_noise_std: 0.5
  train_resize_hw: null              # null = use each sim source's native res
                                     # Hypersim 768×1024, vKITTI2 375×1242
  hypersim:
    enabled: true
    data_root: /data/public/Hypersim/train
    split_train: /workspace/Marigold/data_split/hypersim_depth/filename_list_train_filtered.txt
    dataset_type: hypersim
  vkitti2:
    enabled: true
    data_root: /data/public/vkitti2
    split_train: /workspace/Marigold/data_split/vkitti_depth/vkitti_train.txt
    dataset_type: vkitti2
    # Per-source override (otherwise inherit sim.radar_simulation).
    # Set to "semantic_aware" to use classSegmentation-weighted sampling.
    radar_simulation: null              # null = inherit from sim.radar_simulation
    class_weights: null                 # null = use default reflectivity weights
