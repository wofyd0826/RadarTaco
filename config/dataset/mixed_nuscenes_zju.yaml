# Multi-loader: nuScenes + ZJU-4DRadarCam (paper §3.4 "training data [4, 22]").
# Validation source remains nuScenes so best.pt selection tracks the
# nuScenes comparison metric used in paper Table 1.
name: mixed_nuscenes_zju
data_root: /data/public/nuScenes/derived
split_train:     /data/public/nuScenes/derived/splits/train.txt
split_val:       /data/public/nuScenes/derived/splits/val.txt
split_test:      /data/public/nuScenes/derived/splits/test.txt
split_train_day:   /data/public/nuScenes/derived/splits/train_day.txt
split_train_night: /data/public/nuScenes/derived/splits/train_night.txt
split_val_day:     /data/public/nuScenes/derived/splits/val_day.txt
split_val_night:   /data/public/nuScenes/derived/splits/val_night.txt
split_test_day:    /data/public/nuScenes/derived/splits/test_day.txt
split_test_night:  /data/public/nuScenes/derived/splits/test_night.txt
night_ids_file:    /data/public/nuScenes/derived/splits/night_ids.txt

photometric_aug:
  enabled: false
  prob: 0.5
  gamma_range:      [1.5, 3.0]
  brightness_range: [0.3, 0.7]
  contrast_range:   [0.5, 0.9]
  noise_std_range:  [0.0, 0.05]
  apply_to_night:   false

dense_gt_dir: depth_acc
radar_3d_dir:  radar_3d
max_radar_points: 128
max_depth: 100.0
min_depth: 1.0e-3
train_resize_hw: null
train_crop_hw: null
num_workers: 4
batch_size: 12

# ZJU-4DRadarCam mixing — paper §3.4 trains jointly on [4, 22].
# `ratio` is the picking probability of ZJU per MultiDatasetLoader step,
# relative to `sim.ratio_real` for nuScenes. With sim.ratio_real=1.0 and
# zju.ratio=1.0 each step is 50% chance from each source — closest to the
# paper's "two equal portions". Adjust if you want a different mix.
zju:
  enabled: true
  data_root: /data/public/ZJU-4DRadarCam/data
  split_train: /data/public/ZJU-4DRadarCam/data/train.txt
  split_val:   /data/public/ZJU-4DRadarCam/data/val.txt
  split_test:  /data/public/ZJU-4DRadarCam/data/test.txt
  image_dir:    image
  radar_dir:    radar
  gt_dir:       gt
  gt_interp_dir: gt_interp
  train_resize_hw: null         # ZJU native 1280×720
  train_crop_hw:   null
  ratio: 1.0                    # 1.0 vs sim.ratio_real=1.0 → 50/50

# Sim mixing reused as the nuScenes-side knob for primary-vs-secondary
# weighting. With sim.enabled=false and the new zju block, the loader
# becomes nuScenes:ZJU = ratio_real:zju.ratio.
sim:
  enabled: false
  ratio_real: 1.0
  ratio_sim: 0.0
