name: nuscenes
data_root: /data/public/nuScenes/derived
# Pipeline convention:
#   split_train → train.txt    (used by scripts/train.py)
#   split_val   → val.txt      (used by per-epoch validation inside train.py)
#   split_test  → test.txt     (used by scripts/eval.py default)
# Sub-splits (day/night) are produced by scripts/{classify_night_clip,make_splits}.py
split_train:     /data/public/nuScenes/derived/splits/train.txt
split_val:       /data/public/nuScenes/derived/splits/val.txt
split_test:      /data/public/nuScenes/derived/splits/test.txt
split_train_day:   /data/public/nuScenes/derived/splits/train_day.txt
split_train_night: /data/public/nuScenes/derived/splits/train_night.txt
split_val_day:     /data/public/nuScenes/derived/splits/val_day.txt
split_val_night:   /data/public/nuScenes/derived/splits/val_night.txt
split_test_day:    /data/public/nuScenes/derived/splits/test_day.txt
split_test_night:  /data/public/nuScenes/derived/splits/test_night.txt
night_ids_file:    /data/public/nuScenes/derived/splits/night_ids.txt

# Photometric "night-like" augmentation. Off by default; enable via an
# experiment override. Skips already-night samples unless apply_to_night.
photometric_aug:
  enabled: false
  prob: 0.5                          # fraction of training samples to darken
  gamma_range:      [1.5, 3.0]       # γ > 1 darkens midtones
  brightness_range: [0.3, 0.7]       # multiplicative scale toward black
  contrast_range:   [0.5, 0.9]       # compression toward the local mean
  noise_std_range:  [0.0, 0.05]      # additive Gaussian noise (post-rescale)
  apply_to_night:   false            # don't darken samples already tagged night
# 'depth_acc'    = paper-faithful 80+80 accumulated sparse GT (default, matches Eq.5).
# 'depth_interp' = Delaunay-interp dense GT (alternative).
dense_gt_dir: depth_acc
# Sparse-LiDAR supervision target for the *training* loader. Default raw
# single-frame projection. Set to `depth_lidar_filled` to use the
# residual-fill variant (scripts/build_lidar_filled_gt.py) that propagates
# each LiDAR point's (lidar - dense_gt) into its small neighborhood —
# stripe-suppressing.
lidar_gt_dir: depth_lidar
# Validation/eval LiDAR source. Defaults to canonical depth_lidar so wandb
# val metrics match standalone eval.py and are comparable across runs.
val_lidar_gt_dir: depth_lidar
radar_3d_dir:  radar_3d            # sidecar (N,3) ego (front,left,up) — see scripts/preprocess_radar_3d.py
max_radar_points: 128
max_depth: 100.0
min_depth: 1.0e-3
# Train at full 900×1600 per paper. Set e.g. [450, 800] for smaller GPUs.
train_resize_hw: null
train_crop_hw: null
num_workers: 4
batch_size: 12

# multi-loader sim mixing — disabled here; enable via dataset/mixed.yaml
sim:
  enabled: false
  ratio_real: 1.0
  ratio_sim: 0.0
